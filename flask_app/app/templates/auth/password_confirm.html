{% extends 'base.html' %}
{% block title %}Confirm New Password{% endblock %}
{% block content %}
<style>
    .form-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .form-container h2 {
        margin-bottom: 20px;
        color: #333;
    }

    .form-container input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 1rem;
    }

    .form-container button {
        padding: 10px 20px;
        width: 100%;
        border: none;
        background-color: #0077cc;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.3s ease;
        margin-top: 10px;
    }

    .form-container button:hover {
        background-color: #005fa3;
    }

    @media (max-width: 480px) {
        .form-container {
            margin: 20px;
            padding: 20px;
        }
    }
</style>

<div class="form-container">
    <h2>Set New Password</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="password" name="new_password1" placeholder="New password" required><br>
        <input type="password" name="new_password2" placeholder="Confirm password" required><br>
        <button type="submit">Reset Password</button>
    </form>
</div>
{% endblock %}
